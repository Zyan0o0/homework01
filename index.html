<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>背單字程式</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="header">
        <h1>背單字程式</h1>
        <div class="stats">
            <span id="wordCount">單字總數: 0</span>
        </div>
    </div>

    <div class="main-container">
        <!-- 左側導覽欄 -->
        <nav class="sidebar">
            <div class="nav-buttons">
                <button id="cardViewBtn" class="nav-btn active">卡片模式</button>
                <button id="gridViewBtn" class="nav-btn">網格模式</button>
                <button id="translateViewBtn" class="nav-btn">翻譯工具</button>
                <button id="listViewBtn" class="nav-btn">列表模式</button>
                <button id="adminViewBtn" class="nav-btn">管理單字</button>
            </div>
        </nav>

        <!-- 主要內容區域 -->
        <div class="content">
            <!-- 搜尋欄 -->
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="搜尋單字 (英文或中文)..." class="search-input">
                <span id="searchResult" class="search-result"></span>
            </div>

            <!-- 卡片模式 -->
            <section id="cardView" class="view active">
                <div class="card-container">
                    <div class="card" id="card" role="button" tabindex="0" aria-label="點擊翻面">
                        <div class="card-front">
                            <h2 id="word">apple</h2>
                            <p class="word-number" id="wordNumber">1 / 10</p>
                        </div>
                        <div class="card-back">
                            <h3 id="chinese">蘋果</h3>
                            <p id="partOfSpeech">名詞 (n.)</p>
                            <p id="example">I eat an apple every day.</p>
                        </div>
                    </div>
                </div>
                <p class="card-tip">點擊卡片翻面，或使用下面按鈕切換單字。</p>
                <div class="controls">
                    <button id="prevBtn" class="btn-primary">← 上一個</button>
                    <button id="randomBtn" class="btn-primary">隨機</button>
                    <button id="nextBtn" class="btn-primary">下一個 →</button>
                </div>
            </section>

            <!-- 網格模式 -->
            <section id="gridView" class="view">
                <div class="grid-container">
                    <div class="grid-header">
                        <h2>10個單字網格</h2>
                        <p>點擊卡片查看詳細資訊</p>
                    </div>
                    <div class="words-grid" id="wordsGrid">
                        <!-- 動態生成10個單字卡片 -->
                    </div>
                </div>
            </section>

            <!-- 翻譯工具 -->
            <section id="translateView" class="view">
                <div class="translate-container">
                    <h2>翻譯工具</h2>
                    <div class="translate-form">
                        <div class="translate-input-group">
                            <label for="translateInput">輸入要翻譯的文字:</label>
                            <textarea id="translateInput" placeholder="請輸入英文或中文文字..." rows="4"></textarea>
                        </div>
                        <div class="translate-controls">
                            <div class="direction-controls">
                                <label>
                                    <input type="radio" name="direction" value="en-zh" checked> 英文 → 中文
                                </label>
                                <label>
                                    <input type="radio" name="direction" value="zh-en"> 中文 → 英文
                                </label>
                            </div>
                            <button id="translateBtn" class="btn-translate">翻譯</button>
                        </div>
                    </div>
                    <div class="translate-result" id="translateResult" style="display: none;">
                        <h3>翻譯結果:</h3>
                        <div class="result-text" id="resultText"></div>
                        <div class="result-actions">
                            <button id="copyResultBtn" class="btn-action">複製結果</button>
                            <button id="clearResultBtn" class="btn-action">清除</button>
                        </div>
                    </div>
                    <div class="loading" id="loadingIndicator" style="display: none;">
                        <p>正在翻譯中...</p>
                    </div>
                </div>
            </section>

            <!-- 列表模式 -->
            <section id="listView" class="view">
                <div class="list-controls">
                    <label for="itemsPerPage">每頁顯示:</label>
                    <select id="itemsPerPage">
                        <option value="10">10</option>
                        <option value="20">20</option>
                        <option value="50">50</option>
                    </select>
                </div>
                <div class="words-table-container">
                    <table class="words-table">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>英文</th>
                                <th>中文</th>
                                <th>詞性</th>
                                <th>例句</th>
                            </tr>
                        </thead>
                        <tbody id="wordsTableBody">
                        </tbody>
                    </table>
                </div>
                <div class="pagination">
                    <button id="prevPageBtn" class="btn-pagination">← 上一頁</button>
                    <div class="page-info">
                        <span id="currentPage">第 1 頁</span> / <span id="totalPages">共 1 頁</span>
                        <input type="number" id="pageInput" min="1" class="page-input" placeholder="頁碼">
                        <button id="goToPageBtn" class="btn-pagination">前往</button>
                    </div>
                    <button id="nextPageBtn" class="btn-pagination">下一頁 →</button>
                </div>
            </section>

            <!-- 管理介面 -->
            <section id="adminView" class="view">
                <div class="admin-container">
                    <h2>新增單字</h2>
                    <form id="addWordForm">
                        <div class="form-group">
                            <label for="english">英文單字:</label>
                            <input type="text" id="english" required>
                        </div>
                        <div class="form-group">
                            <label for="chinese">中文解釋:</label>
                            <input type="text" id="chineseInput" required>
                        </div>
                        <div class="form-group">
                            <label for="pos">詞性:</label>
                            <input type="text" id="pos" placeholder="例: 名詞 (n.)" required>
                        </div>
                        <div class="form-group">
                            <label for="exampleInput">例句:</label>
                            <input type="text" id="exampleInput" required>
                        </div>
                        <button type="submit" class="btn-submit">新增單字</button>
                    </form>
                    
                    <h2>批量操作</h2>
                    <div class="bulk-actions">
                        <button id="exportBtn" class="btn-action">匯出為 JSON</button>
                        <button id="importBtn" class="btn-action">從 JSON 匯入</button>
                        <input type="file" id="importFile" accept=".json" style="display: none;">
                        <button id="clearBtn" class="btn-action btn-danger">清空所有單字</button>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
